<!-- lang="en" ZORUNLU: CrazyGames'in ilk reddinde acikca "varsayilan oyun dili
     Ingilizce olmali" dendi. Arayuz metinlerinin cevrilmesi yetmiyor; belgenin
     kendisi de dilini beyan etmeli (ekran okuyucu, cevirmen ve portalin
     otomatik denetimi bunu okuyor). -->
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- PWA: telefonda "ana ekrana ekle" ile magaza olmadan uygulama gibi kurulsun.
     Yol GORELI (`./`) - oyun site kokunde de, /satranc3d/ alt dizininde de,
     itch.io'nun rastgele yolunda da ayni derlemeyle calisiyor (vite base:"./"). -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#151719" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Kung-Fu Chess 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #151719; overflow: hidden; }
  body { font: 15px/1.4 system-ui, -apple-system, sans-serif; color: #e8e4dc; }
  #scene { display: block; width: 100vw; height: 100vh; touch-action: none; }
  /* Portal sarti: mobilde uzun basinca metin secimi ve vurgulama cikmasin */
  html, body { -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  #hud {
    position: fixed; top: 16px; left: 16px; display: flex; gap: 12px; align-items: center;
    background: rgba(20,22,25,.78); border: 1px solid #34383d; border-radius: 10px;
    padding: 10px 14px; backdrop-filter: blur(8px);
  }
  #status { font-weight: 600; letter-spacing: .2px; }
  #status.over { color: #ff8a6b; }
  #reset {
    font: inherit; font-size: 13px; color: #e8e4dc; cursor: pointer;
    background: #2a2e33; border: 1px solid #41464c; border-radius: 6px; padding: 5px 11px;
  }
  #reset:hover { background: #343940; }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 20; background: rgba(255,235,200,0); }

  /* --- ayarlar / dondurme aparati --- */
  #ui button { font: inherit; color: #e8e4dc; cursor: pointer;
    background: rgba(30,34,39,.9); border: 1px solid #41464c; border-radius: 8px; }
  #ui button:hover { background: #3a4047; }
  /* Secili durum: #ui button id ozgullugunu tasidigi icin bu kural da
     tasimali, yoksa .active hicbir zaman uste cikmiyor. */
  #ui button.active { background: #2f6d8a; border-color: #7fd4ff; }

  .gear { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px;
    font-size: 19px; line-height: 1; backdrop-filter: blur(8px); }

  /* Panel KENDI ICINDE kayar. Sabit konumlu ve govde `overflow:hidden` —
     yani panel viewport'tan uzun oldugunda tasan kisma ulasmanin baska yolu
     yok. Telefon yatayda (ornek: 844x390) icerik ~485 px, gear'in altinda
     ~320 px yer var: Oldurus ve Kamera bolumleri ekranin disinda kaliyordu. */
  .panel { position: fixed; top: 66px; right: 16px; width: 250px; z-index: 5;
    background: rgba(22,25,29,.94); border: 1px solid #383d43; border-radius: 12px;
    padding: 14px; backdrop-filter: blur(10px);
    max-height: calc(100vh - 82px);
    max-height: calc(100dvh - 82px - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; overscroll-behavior: contain;
    /* #scene `touch-action:none` — panelde parmakla kaydirma acik kalmali */
    touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: #464c54; border-radius: 3px; }
  .panel[hidden] { display: none; }
  .panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: #8b929b; margin: 0 0 8px; }
  .panel h3 + * { margin-bottom: 14px; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .swatch { display: flex; flex-direction: column; gap: 5px; padding: 7px; align-items: stretch; }
  .swatch.active { border-color: #7fd4ff; box-shadow: 0 0 0 1px #7fd4ff inset; }
  .swatch .chip { display: flex; height: 17px; border-radius: 4px; overflow: hidden; }
  .swatch .chip i { flex: 1; }
  .swatch .name { font-size: 11px; color: #c2c7ce; }
  .panel .seg { display: flex; gap: 5px; margin-bottom: 7px; }
  .panel .seg[hidden] { display: none; }
  .panel .seg button { flex: 1; font-size: 12px; padding: 7px 2px; }
  /* Bes dugmelik satir (rakip seciminde Usta eklendi) tek satira sigmiyor */
  .panel .seg5 { flex-wrap: wrap; }
  .panel .seg5 button { flex: 1 1 28%; }
  .panel .row { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .panel .hint { font-size: 11px; color: #767d86; margin-top: 12px; line-height: 1.45; }

  .dock { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px;
    background: rgba(22,25,29,.86); border: 1px solid #383d43; border-radius: 11px;
    padding: 6px; backdrop-filter: blur(10px); }
  .dock button { width: 38px; height: 38px; font-size: 15px; }

  @media (max-width: 560px) {
    .panel { width: calc(100vw - 32px); }
    .dock button { width: 44px; height: 44px; }
  }
  /* Telefon YATAY: oyunun oynandigi yerlesim (bkz. README). Yukseklik
     dar oldugu icin panel sikisiyor — kaydirma yine acik, ama daha az
     gerekiyor. Ipucu metni duruyor: dokunmatik kontrolleri o anlatiyor. */
  @media (max-height: 480px) {
    .panel { top: 60px; padding: 11px; }
    .panel h3 { margin-bottom: 5px; }
    .panel h3 + * { margin-bottom: 9px; }
    .panel .seg button { padding: 6px 2px; }
    .swatches { grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .swatch { padding: 5px; }
    .swatch .chip { height: 13px; }
    .panel .hint { margin-top: 8px; }
  }
  /* --- yukleme perdesi ve ana menu --- *
     Ikisi ayni gorsel dil: ortada kart, ustte oyunun adi. Oyuncu yukleme
     ekranindan menuye gecerken baslik YERINDEN OYNAMIYOR, sadece altindaki
     icerik degisiyor -- iki ayri ekran gibi degil, tek ekranin iki hali
     gibi duruyor.

     Yukleme perdesi index.html'de DURUYOR, JS uretmiyor: 742 KB'lik paket
     ayristirilana kadar gecen surede de ekranda bir sey olmali. JS uretseydi
     ilk saniyeler bos siyah ekran olurdu - portalin "kalite" olcutunun tam
     olarak baktigi yer. */
  #yukleme, #menu {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 38%, #1e2226 0%, #101214 62%, #0a0b0d 100%);
    padding: 24px;
  }
  #menu { background: rgba(10, 11, 13, .78); backdrop-filter: blur(7px); }
  #yukleme[hidden], #menu[hidden] { display: none; }
  /* Yukleme perdesi kaybolurken sahne arkasindan aciliyor */
  #yukleme.gidiyor { opacity: 0; transition: opacity .45s ease; pointer-events: none; }

  .perde-kart { width: min(400px, 100%); text-align: center; }
  .perde-kart h1 {
    font-size: clamp(23px, 5.4vw, 34px); font-weight: 700; letter-spacing: .055em;
    line-height: 1.15; margin-bottom: 9px;
    background: linear-gradient(180deg, #f6ead4 0%, #e0a44e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .perde-kart .slogan {
    font-size: 13px; color: #8b929b; letter-spacing: .02em; margin-bottom: 26px;
  }

  /* Yukleme cubugu. Yuzde YAZIYLA da veriliyor: cubuk tek basina "takildi mi,
     yavas mi" sorusunu cevaplamiyor, 7 MB'lik indirmede oyuncu bunu soruyor. */
  .bar {
    height: 5px; border-radius: 3px; background: #24282d; overflow: hidden;
    margin-bottom: 11px;
  }
  .bar i {
    display: block; height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, #b7671d, #ffc23d);
    transition: width .25s ease;
  }
  #yukYazi { font-size: 12px; color: #767d86; letter-spacing: .03em; }

  /* Menu: zorluk secimi + tek buyuk baslat dugmesi. */
  /* auto-fit: dugme sayisi degisince (Usta eklendi) satir kendiliginden
     sariyor. Sabit 4 sutunda besinci dugme kartin disina tasiyordu. */
  #menu .seg {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr));
    gap: 6px; margin-bottom: 10px;
  }
  #menu .seg button {
    font: inherit; font-size: 12px; padding: 9px 2px; cursor: pointer;
    color: #c2c7ce; background: rgba(30, 34, 39, .9);
    border: 1px solid #41464c; border-radius: 8px;
  }
  #menu .seg button:hover { background: #3a4047; }
  #menu .seg button.active { background: #2f6d8a; border-color: #7fd4ff; color: #fff; }
  #menu .etiket {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: #8b929b; margin-bottom: 8px; text-align: left;
  }
  #menuOyna {
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: .06em;
    width: 100%; margin-top: 16px; padding: 14px; cursor: pointer; color: #1a1206;
    background: linear-gradient(180deg, #ffc855, #dd8f23);
    border: 1px solid #ffd680; border-radius: 10px;
  }
  #menuOyna:hover { background: linear-gradient(180deg, #ffd478, #e89b2c); }
  .menu-ipucu { font-size: 11px; color: #767d86; margin-top: 14px; line-height: 1.45; }

  /* Oyun basvermeden HUD ve kumandalar durmasin: menude tahta bir "vitrin",
     ustunde dugme olmasi o hissi bozuyor. */
  body[data-asama="yukleme"] #hud, body[data-asama="yukleme"] #ui,
  body[data-asama="menu"] #hud, body[data-asama="menu"] #ui { display: none; }

  #promo[hidden] { display: none; }
  #promo {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(10,11,13,.72); backdrop-filter: blur(4px); z-index: 10;
  }
  #promo .card {
    background: #1d2024; border: 1px solid #3a3f45; border-radius: 12px;
    padding: 18px 20px; text-align: center;
  }
  #promo h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  #promo .row { display: flex; gap: 8px; }
  #promo button {
    font: inherit; font-size: 13px; color: #e8e4dc; cursor: pointer; min-width: 74px;
    background: #2a2e33; border: 1px solid #41464c; border-radius: 8px; padding: 9px 12px;
  }
  #promo button:hover { background: #363b42; border-color: #5a616a; }

  /* --- oyun sonu perdesi --- *
     Oyun bitince tek yaptigi sey durum yazisini degistirmekti; oyuncunun
     "New game"i sol ustte KENDISI bulmasi gerekiyordu. Tutma acisindan en
     kritik an bu: yenilen oyuncu bir sey aramak zorunda kalirsa gidiyor.
     Perde matin hemen ardindan gelir ve rovans tek tikla erisilir. */
  #son[hidden] { display: none; }
  #son {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 12;
    background: rgba(10,11,13,.66); backdrop-filter: blur(3px);
    animation: sonGir .28s ease both;
  }
  @keyframes sonGir { from { opacity: 0 } to { opacity: 1 } }
  #son .card {
    background: #1d2024; border: 1px solid #3a3f45; border-radius: 14px;
    padding: 22px 26px; text-align: center; min-width: 260px;
  }
  #son h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
  #son .alt { font-size: 13px; color: #8b929b; margin-bottom: 16px; }
  /* Uc dugme dar telefonda tek sataya sigmiyor -- sarmasi serbest. */
  #son .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #son button {
    font: inherit; font-size: 13px; color: #e8e4dc; cursor: pointer;
    background: #2a2e33; border: 1px solid #41464c; border-radius: 8px; padding: 10px 16px;
  }
  #son button.primary { background: #2f6d8a; border-color: #7fd4ff; }
  #son button:hover { background: #363b42; border-color: #5a616a; }
  #son button.primary:hover { background: #37809f; }
</style>

<!-- Olcum: GoatCounter. Cerez yok, kisisel veri yok - bu yuzden cerez
     bandi da gerekmiyor. Tek merak ettigimiz sey su: YouTube'dan gelen kac
     kisi oyuna DOKUNUYOR? Sayfa goruntulemesi tek basina bunu soylemiyor.
     `path` ozellestiriliyor ki kaynak (?s=yt) ayri satir olarak dussun;
     yoksa YouTube trafigi ile dogrudan gelen ayirt edilemiyor. -->
<!-- !! `path` OZELLESTIRILMIYOR. Once burada ?s=... elle ekleniyordu; canlida
     yol `/satranc3d/?s=yt?s=yt` diye CIFT cikti - GoatCounter sorgu dizesini
     zaten kendisi ekliyor. Eklemeye kalkma. -->
<script>
  /* GoatCounter YALNIZCA kendi sitemizde.

     !! IZIN LISTESI, DISLAMA LISTESI DEGIL (13-08-2026'da degisti).
     Once "crazygames.(com|nl) DISINDA her yerde yukle" yaziliydi. Iki hatasi
     vardi ve ikincisi olculdu:
       1. Portalin onlarca ulke alan adi var (crazygames.fr, .com.br, .co.id...);
          kalip onlari kacirIyordu - portal.js ayni dersi belgeliyor.
       2. Oyun 13-08'de itch.io'ya girdi ve orada `html.itch.zone` iframe'inde
          calisiyor. Dislama listesi itch'i bilmedigi icin GoatCounter ORADA DA
          yukleniyordu: itch'te oynayan herkes GitHub Pages ziyaretcisi gibi
          dusecekti. Tam da olcum icin itch'e gectigimiz gun iki vitrinin
          sayilari tek panoda karisirdi.
     Dogru cozum listeyi uzatmak degil, TERSINE CEVIRMEK: yalnizca kendi
     kanonik alan adimizda (ve gelistirmede localhost'ta) yukle. Boylece
     yarin baska bir portala girildiginde burayi gunellemek gerekmiyor.

     Protokol-goreli "//" yerine acik https: paketten dosya olarak
     acildiginda "//" file: protokolune cozulup istegi olduruyor. */
  /* Asama: yukleme -> menu -> oyun. HUD ve kumandalar CSS'te buna gore
     gizleniyor. Paket yuklenmeden once yazilmasi sart, yoksa ilk karede
     HUD bir an gorunuyor. */
  document.body.dataset.asama = "yukleme";

  var _kendiSitemiz = location.hostname === "akcasakiz.github.io" ||
                      location.hostname === "localhost" ||
                      location.hostname === "127.0.0.1";
  if (_kendiSitemiz) {
    var _gc = document.createElement("script");
    _gc.async = true;
    _gc.src = "https://gc.zgo.at/count.js";
    _gc.setAttribute("data-goatcounter", "https://whitegum.goatcounter.com/count");
    document.head.appendChild(_gc);
  }

  /* Service worker: PWA kurulumu + ilk ziyaretten sonra cevrimdisi oynama.
     Iki kosul da ZORUNLU:
     - IFRAME'DE KAYIT ETME. CrazyGames ve itch.io oyunu kendi alan adlarinda
       iframe icinde servis ediyor; orada worker'in kapsami bize ait degil,
       kurulabilir uygulama diye bir sey de yok. Portalin olcumune bulasmanin
       da anlami yok.
     - Guvenli baglam sart. file:// ile acilan pakette (CrazyGames teknik
       incelemesi oyunu boyle de aciyor) registration hata firlatir. */
  if (window.top === window && "serviceWorker" in navigator) {
    addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {
        /* PWA olmazsa oyun yine calisiyor - sessizce gec. */
      });
    });
  }
</script>

<canvas id="scene"></canvas>

<!-- Yukleme perdesi: JS'ten ONCE, dogrudan belgede. Paket ayristirilana ve
     12 GLB (~7 MB) inene kadar ekranda duran tek sey bu. -->
<div id="yukleme">
  <div class="perde-kart">
    <h1>KUNG-FU CHESS 3D</h1>
    <p class="slogan">Every capture is a Shaolin duel</p>
    <div class="bar"><i id="yukDolgu"></i></div>
    <p id="yukYazi">Loading…</p>
  </div>
</div>

<div id="menu" hidden>
  <div class="perde-kart">
    <h1>KUNG-FU CHESS 3D</h1>
    <p class="slogan">Every capture is a Shaolin duel</p>
    <p class="etiket">Opponent</p>
    <div class="seg" id="menuRakip">
      <button data-opp="kolay">Easy</button>
      <button data-opp="orta">Medium</button>
      <button data-opp="zor">Hard</button>
      <button data-opp="usta">Master</button>
      <button data-opp="insan">2P</button>
    </div>
    <button id="menuOyna">PLAY</button>
    <p class="menu-ipucu">Drag the board to look around · pinch or scroll to zoom.</p>
  </div>
</div>

<div id="hud">
  <span id="status">Loading…</span>
  <button id="reset">New game</button>
  <button id="ipucu">Hint</button>
</div>
<div id="flash"></div>
<div id="ui"></div>

<div id="son" hidden>
  <div class="card">
    <h2 id="sonBaslik"></h2>
    <p class="alt" id="sonAlt"></p>
    <div class="row">
      <button id="sonRovans" class="primary">Rematch</button>
      <button id="sonTaraf">Switch sides</button>
      <button id="sonMenu">Menu</button>

<div id="promo" hidden>
  <div class="card">
    <h2>Pawn promotion — pick a piece</h2>
    <div class="row">
      <button data-piece="q">Queen</button>
      <button data-piece="r">Rook</button>
      <button data-piece="b">Bishop</button>
      <button data-piece="n">Knight</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
